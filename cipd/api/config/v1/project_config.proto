syntax = "proto3";

package cipd.config;

option go_package = "go.chromium.org/luci/cipd/api/config/v1;api";

// ProjectConfigFile is a per-project config file which maps CIPD package
// prefixes to configuration for that prefix.
//
// This is read as `cipd.cfg` or `cipd-dev.cfg`.
//
// Prefixes contained here are only respected by the service if the service's
// own prefixes.cfg file indicates that this is the `owning_luci_project`.
message ProjectConfigFile {
  // A list of per-prefix entries.
  //
  // Duplicates by `path` are not allowed.
  //
  // These prefixes are full CIPD prefixes relative to the CIPD repo root (/),
  // NOT relative to the global prefixes.cfg config.
  //
  // For example, if the global config maps both `a/b` and `a/deep/something`
  // to this project, and `prefixes` below contains the following settings, they
  // would be ignored/respected as:
  //   * "a" - Ignored for "a" itself (not owned by this project), but inherited
  //     by owned subprefix "a/b".
  //   * "a/b/c" - Respected.
  //   * "a/deep/somethingelse" - Ignored.
  //   * "a/deep/something/else" - Respected.
  //
  // The server issues warnings for project-supplied mappings for prefixes not
  // owned by the project, rather than rejecting them, to make migrations
  // (where e.g. ownership of a package is passed from one project to another)
  // possible without requiring downtime or race conditions.
  repeated PrefixSettings prefixes = 1;
}

// PrefixSettings indicate settings which apply to CIPD packages whose names
// begin with the given path prefix.
message PrefixSettings {
  // The prefix path (e.g. "infra/tools") or "/" to indicate the root.
  string path = 1;

  // Realm indicates the LUCI realm which should be used for all packages under
  // this prefix.
  //
  // Required. This MUST be a 'project scoped' realm e.g. it is just "<realm>"
  // (instead of "<project>:<realm>").
  //
  // Only one realm ever applies to a given package, and will be the deepest
  // PrefixSettings which applies to that package.
  //
  // If no PrefixSettings entry applies to a package, the owning project's
  // `@root` realm applies.
  string realm = 2;
}
